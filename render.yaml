# Render Blueprint — adjust names and env values in the dashboard after first deploy.
# Use with: render.yaml in repo root, or create services manually from this template.

services:
  - type: web
    name: cpu-api-staging
    runtime: node
    # Monorepo: install from repo root so workspace package @cpu/shared resolves (not from npm registry).
    buildCommand: npm install && npm run build --workspace @cpu/shared && npm run build --workspace @cpu/api
    preDeployCommand: cd apps/api && npx prisma migrate deploy --schema=prisma/schema.postgresql.prisma
    startCommand: cd apps/api && npm run start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
