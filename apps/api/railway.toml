# Railway: Service → Settings → Root Directory: apps/api
# Variables: see apps/api/.env.staging.example and RAILWAY.md
# Release command intentionally disabled temporarily so deploy only builds/starts:
#   buildCommand = npm install && npm run build
#   startCommand = node dist/server.js

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
# Apply pending migrations before serving (fixes missing tables after deploy if no release hook is set in Railway UI).
startCommand = "npx prisma migrate deploy --schema=prisma/schema.postgresql.prisma && node dist/server.js"
