# Railway: Service → Settings → Root Directory: apps/api
# Variables: see apps/api/.env.staging.example and RAILWAY.md
# Release command intentionally disabled temporarily so deploy only builds/starts:
#   buildCommand = npm install && npm run build
#   startCommand = node dist/server.js

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "node dist/server.js"
